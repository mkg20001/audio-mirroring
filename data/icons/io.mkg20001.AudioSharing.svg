<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3584e4"/>

  <!-- Central speaker icon -->
  <g fill="#ffffff">
    <!-- Speaker body -->
    <path d="M42 48 L42 80 L30 80 L30 48 Z"/>
    <path d="M42 48 L58 36 L58 92 L42 80 Z"/>
  </g>

  <!-- Sound waves broadcasting outward -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <!-- Inner wave -->
    <path d="M64 52 Q72 64 64 76" opacity="0.9"/>
    <!-- Middle wave -->
    <path d="M72 44 Q84 64 72 84" opacity="0.7"/>
    <!-- Outer wave -->
    <path d="M80 36 Q96 64 80 92" opacity="0.5"/>
  </g>

  <!-- Receiver devices (small speakers with waves) -->
  <g opacity="0.85">
    <!-- Top right receiver -->
    <g transform="translate(86, 24) scale(0.5)">
      <g fill="#ffffff">
        <rect x="0" y="8" width="8" height="16" rx="1"/>
        <path d="M8 8 L18 0 L18 32 L8 24 Z"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <path d="M22 10 Q26 16 22 22" opacity="0.8"/>
        <path d="M27 6 Q33 16 27 26" opacity="0.5"/>
      </g>
    </g>

    <!-- Right receiver -->
    <g transform="translate(94, 56) scale(0.5)">
      <g fill="#ffffff">
        <rect x="0" y="8" width="8" height="16" rx="1"/>
        <path d="M8 8 L18 0 L18 32 L8 24 Z"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <path d="M22 10 Q26 16 22 22" opacity="0.8"/>
        <path d="M27 6 Q33 16 27 26" opacity="0.5"/>
      </g>
    </g>

    <!-- Bottom right receiver -->
    <g transform="translate(86, 88) scale(0.5)">
      <g fill="#ffffff">
        <rect x="0" y="8" width="8" height="16" rx="1"/>
        <path d="M8 8 L18 0 L18 32 L8 24 Z"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <path d="M22 10 Q26 16 22 22" opacity="0.8"/>
        <path d="M27 6 Q33 16 27 26" opacity="0.5"/>
      </g>
    </g>
  </g>
</svg>
